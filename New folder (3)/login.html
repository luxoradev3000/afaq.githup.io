<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول | أكاديمية آفاق</title>
<script>try{var t=localStorage.getItem("afaqTheme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
:root{--red:#b3173f;--red2:#d6335f;--bg:#0c0709;--fg:#fff;--mute:#cbc4c7;--line:rgba(255,255,255,.12);--card:#17101a;--field:rgba(255,255,255,.06);--ring:#cfd3d8;--err:#ff8aa5;--okc:#6fe3a0}
:root[data-theme="light"]{--bg:#fbf6f7;--fg:#241419;--mute:#5e4f55;--line:rgba(36,20,25,.15);--card:#fff;--field:#fff;--ring:#9ca0a6;--err:#b3173f;--okc:#14804a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:Cairo,Tahoma,sans-serif;font-size:17px;line-height:1.7}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--red2);outline-offset:2px}
.shell{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.brandp{background:radial-gradient(circle at 20% 15%,rgba(214,51,95,.35),transparent 55%),linear-gradient(160deg,#5c0f2b,#150509);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.brandp svg,.mini svg{width:84px;height:84px}
.brandp h1{margin:0;font-size:clamp(30px,3.6vw,46px);font-weight:900;line-height:1.35;font-family:'Reem Kufi',Cairo,sans-serif}
.brandp p{margin:0;max-width:24em;color:#e6d5db;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips span{background:rgba(255,255,255,.14);border-radius:999px;padding:0 14px;font-size:15px;font-weight:600}
.formp{display:flex;flex-direction:column;padding:20px 24px}
.top{display:flex;justify-content:space-between;align-items:center}
.top a{text-decoration:none;font-weight:600;color:var(--mute)}
.top a:hover{color:var(--fg)}
.ic{background:transparent;border:1.5px solid var(--ring);color:var(--fg);border-radius:12px;padding:6px 9px;cursor:pointer;display:inline-flex}
.ic svg{width:20px;height:20px}.i-moon{display:none}
:root[data-theme="light"] .i-sun{display:none}:root[data-theme="light"] .i-moon{display:inline}
.wrap{flex:1;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 28px}
.mini{display:none;text-align:center}.mini svg{width:64px;height:64px}
h2{margin:0 0 4px;font-size:28px;font-weight:900}
.sub{margin:0 0 18px;color:var(--mute)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:20px}
.tabs button{border:0;background:transparent;color:var(--mute);font:inherit;font-weight:800;padding:8px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--red);color:#fff}
label{display:block;font-weight:600;margin:14px 0 4px;font-size:16px}
.in{position:relative}
input[type=text],input[type=password]{width:100%;padding:13px 14px;background:var(--field);color:var(--fg);border:1px solid var(--line);border-radius:14px;font:inherit}
input:focus{border-color:var(--red2)}
.eye{position:absolute;left:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mute);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0;font-size:15px}
.row label{margin:0;display:flex;gap:8px;align-items:center;font-weight:400}
.row a{color:var(--red2);font-weight:600;text-decoration:none}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--red);color:#fff;font:inherit;font-weight:800;font-size:18px;padding:13px;cursor:pointer;text-align:center;text-decoration:none}
.btn:hover{background:#cc1c49}.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;border:1.5px solid var(--ring);color:var(--fg);margin-top:10px}
.msg{min-height:26px;margin:12px 0 0;font-size:15px;font-weight:600}
.msg.err{color:var(--err)}.msg.ok{color:var(--okc)}
.ok-view{text-align:center}
.ok-view h2{margin-top:8px}
@media (max-width:860px){
 .shell{grid-template-columns:1fr}
 .brandp{display:none}
 .mini{display:block;margin-bottom:6px}
 .card{padding:24px 20px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="mark" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="30" fill="none" style="stroke:var(--ring)" stroke-width="2"/>
  <path d="M40 9C52 21 52 38 36 57 41 44 39 32 31 24 37 24 43 18 40 9Z" fill="#d6335f"/>
  <path d="M30 27C21 33 20 45 27 55 24 47 26 40 33 35 31 33 30 30 30 27Z" fill="#b3173f"/>
  <path d="M33 38C29 42 29 49 33 54 31 49 33 44 36 41Z" fill="#8a1230"/>
  <rect x="16" y="14" width="10" height="10" rx="1.5" fill="#d6335f" transform="rotate(45 21 19)"/>
 </symbol>
</svg>

<div class="shell">
 <aside class="brandp">
  <svg aria-hidden="true"><use href="#mark"/></svg>
  <h1>أهلاً بك في أكاديمية آفاق</h1>
  <p>سجّل دخولك لمتابعة حسابك مع الأكاديمية، أو أنشئ حساباً جديداً في دقيقة.</p>
  <div class="chips"><span>المنهج المصري</span><span>مناهج الخليج</span><span>حصص مباشرة</span></div>
 </aside>

 <section class="formp">
  <div class="top">
   <a href="index.html">العودة إلى الموقع</a>
   <button class="ic" id="theme" aria-label="تبديل الوضع الفاتح والداكن" title="تبديل الوضع">
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
   </button>
  </div>

  <div class="wrap">
   <div class="card">
    <div class="mini"><svg aria-hidden="true"><use href="#mark"/></svg></div>

    <div id="authBox">
     <h2>مرحباً بعودتك</h2>
     <p class="sub">ادخل إلى حسابك أو أنشئ حساباً جديداً.</p>
     <div class="tabs" role="tablist">
      <button class="on" id="tLogin" role="tab" aria-selected="true" type="button">تسجيل الدخول</button>
      <button id="tReg" role="tab" aria-selected="false" type="button">إنشاء حساب</button>
     </div>

     <form id="fLogin" novalidate>
      <label for="lId">رقم الهاتف أو البريد الإلكتروني</label>
      <input id="lId" type="text" dir="auto" autocomplete="username" required>
      <label for="lPw">كلمة المرور</label>
      <div class="in"><input id="lPw" type="password" autocomplete="current-password" required><button class="eye" type="button" data-for="lPw">إظهار</button></div>
      <div class="row">
       <label><input type="checkbox" id="rem"> تذكرني</label>
       <a id="forgot" href="#" target="_blank" rel="noopener">نسيت كلمة المرور؟</a>
      </div>
      <button class="btn" type="submit">تسجيل الدخول</button>
     </form>

     <form id="fReg" novalidate hidden>
      <label for="rName">الاسم الكامل</label>
      <input id="rName" type="text" autocomplete="name" required>
      <label for="rId">رقم الهاتف أو البريد الإلكتروني</label>
      <input id="rId" type="text" dir="auto" autocomplete="username" required>
      <label for="rPw">كلمة المرور (8 أحرف على الأقل)</label>
      <div class="in"><input id="rPw" type="password" autocomplete="new-password" required><button class="eye" type="button" data-for="rPw">إظهار</button></div>
      <label for="rPw2">تأكيد كلمة المرور</label>
      <div class="in"><input id="rPw2" type="password" autocomplete="new-password" required><button class="eye" type="button" data-for="rPw2">إظهار</button></div>
      <div class="row"></div>
      <button class="btn" type="submit">إنشاء الحساب</button>
     </form>
     <p class="msg" id="msg" role="alert" aria-live="polite"></p>
    </div>

    <div class="ok-view" id="ok" hidden>
     <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--okc)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>
     <h2>أهلاً <span id="who"></span></h2>
     <p class="sub">تم تسجيل دخولك بنجاح.</p>
     <a class="btn" href="index.html">الذهاب إلى الموقع</a>
     <button class="btn ghost" id="logout" type="button">تسجيل الخروج</button>
    </div>
   </div>
  </div>
 </section>
</div>

<script>
// رقم الواتساب لرابط "نسيت كلمة المرور" (يتغير بأمر: python afaq.py set number ...)
window.SITE = {
  "number": "201108260667"
};
</script>
<script>
var $ = function (s) { return document.querySelector(s); };
var NUMBER = String((window.SITE || {}).number || "").replace(/\D/g, "");
if (NUMBER.charAt(0) === "0") NUMBER = "20" + NUMBER.slice(1);
$("#forgot").href = "https://wa.me/" + NUMBER + "?text=" + encodeURIComponent("السلام عليكم، نسيت كلمة المرور لحسابي في آفاق");

$("#theme").addEventListener("click", function () {
  var r = document.documentElement, n = r.dataset.theme === "light" ? "dark" : "light";
  r.dataset.theme = n;
  try { localStorage.setItem("afaqTheme", n); } catch (e) {}
});

function msg(t, ok) { var m = $("#msg"); m.textContent = t || ""; m.className = "msg " + (ok ? "ok" : "err"); }
function tab(login) {
  $("#fLogin").hidden = !login; $("#fReg").hidden = login;
  $("#tLogin").classList.toggle("on", login); $("#tReg").classList.toggle("on", !login);
  $("#tLogin").setAttribute("aria-selected", login); $("#tReg").setAttribute("aria-selected", !login);
  msg("");
}
$("#tLogin").onclick = function () { tab(true); };
$("#tReg").onclick = function () { tab(false); };

document.querySelectorAll(".eye").forEach(function (b) {
  b.addEventListener("click", function () {
    var i = document.getElementById(b.dataset.for), show = i.type === "password";
    i.type = show ? "text" : "password"; b.textContent = show ? "إخفاء" : "إظهار";
  });
});

function api(path, body) {
  return fetch(path, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: body ? JSON.stringify(body) : undefined })
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.error || "خدمة الحسابات غير متاحة حالياً. تواصل معنا عبر واتساب.");
        return d;
      });
    });
}
function v(id) { return $(id).value.trim(); }
function done(d) { $("#authBox").hidden = true; $("#ok").hidden = false; $("#who").textContent = d.name; }

function wire(form, path, build) {
  form.addEventListener("submit", function (e) {
    e.preventDefault(); msg("");
    var b = form.querySelector("[type=submit]"), body;
    try { body = build(); } catch (er) { msg(er.message); return; }
    b.disabled = true;
    api(path, body).then(done).catch(function (er) {
      msg(er.name === "TypeError" ? "تعذّر الاتصال بالخادم، حاول مرة أخرى." : er.message);
    }).then(function () { b.disabled = false; });
  });
}
wire($("#fLogin"), "/api/login", function () {
  if (!v("#lId") || !$("#lPw").value) throw new Error("أدخل بيانات الدخول كاملة.");
  return { ident: v("#lId"), password: $("#lPw").value, remember: $("#rem").checked };
});
wire($("#fReg"), "/api/register", function () {
  if (v("#rName").length < 3) throw new Error("اكتب اسمك الكامل.");
  if (!v("#rId")) throw new Error("أدخل رقم الهاتف أو البريد الإلكتروني.");
  if ($("#rPw").value.length < 8) throw new Error("كلمة المرور يجب ألا تقل عن 8 أحرف.");
  if ($("#rPw").value !== $("#rPw2").value) throw new Error("كلمتا المرور غير متطابقتين.");
  return { name: v("#rName"), ident: v("#rId"), password: $("#rPw").value };
});
$("#logout").addEventListener("click", function () { api("/api/logout", {}).then(function () { location.reload(); }); });

api("/api/me").then(done).catch(function () {});
</script>
</body>
</html>
